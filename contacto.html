<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbelShop | Contacto</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="./images/icono.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <h1 id="formulario-titulo">Completa el formulario:</h1>

    <div class="formulario">
        <label for="name">Nombre: <span class="obligatorio">*</span></label> 
        <input type="text" placeholder="Inserta tu nombre completo">
        <label for="name">Correo electrónico: <span class="obligatorio">*</span></label> 
        <input type="email" placeholder="Inserta tu correo.">
        <label for="name">Número de teléfono: <span class="obligatorio">*</span></label> 
        <input type="tel" placeholder="Inserta tu número de teléfono.">
        <label for="name">Comentarios (opcional):</label> 
        <textarea id="comentarios" placeholder="¿Pregutas? ¿Comentarios?"></textarea>

        
    </div>
    <button id="enviar-form">Enviar</button>
    <div id="mensaje-exito">
    <h2>✅ ¡Formulario enviado!</h2>
    <p>Gracias por contactarnos 🚀</p>
</div>

<style>

#mensaje-exito{
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: #111;
    color: white;
    padding: 40px 60px;
    border-radius: 15px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: 0.5s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

#mensaje-exito.mostrar{
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

.formulario.fade{
    opacity: 0.3;
    transition: 0.5s;
}

</style>

        <script>
        document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", function(e){
        e.preventDefault();

        const url = this.href;

        document.body.classList.add("fade-out");

        setTimeout(() => {
            window.location = url;
        }, 500);
    });
});

const botonEnviar = document.getElementById("enviar-form");
const mensaje = document.getElementById("mensaje-exito");
const formulario = document.querySelector(".formulario");

botonEnviar.addEventListener("click", () => {

    const inputs = document.querySelectorAll(".formulario input");

    let vacio = false;

    inputs.forEach(input => {
        if(input.value.trim() === ""){
            vacio = true;
        }
    });

    if(vacio){
        alert("⚠️ Completa los campos obligatorios.");
        return;
    }

    formulario.classList.add("fade");

    setTimeout(() => {
        mensaje.classList.add("mostrar");
    }, 300);

    setTimeout(() => {
        document.querySelectorAll("input, textarea").forEach(el => el.value = "");
        formulario.classList.remove("fade");
        mensaje.classList.remove("mostrar");
    }, 3000);

});

</script>
</body>
</html>
