<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbelShop | Contacto</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="./images/icono.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <h1 id="formulario-titulo">Completa el formulario:</h1>

    <div class="formulario">
        <label for="name">Nombre: <span class="obligatorio">*</span></label> 
        <input type="text" placeholder="Inserta tu nombre completo">
        <label for="name">Correo electrónico: <span class="obligatorio">*</span></label> 
        <input type="email" placeholder="Inserta tu correo.">
        <label for="name">Número de teléfono: <span class="obligatorio">*</span></label> 
        <input type="tel" placeholder="Inserta tu número de teléfono.">
        <label for="name">Comentarios (opcional):</label> 
        <textarea id="comentarios" placeholder="¿Pregutas? ¿Comentarios?"></textarea>

        
    </div>
    <button id="enviar-form">Enviar</button>

        <script>
        document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", function(e){
        e.preventDefault();

        const url = this.href;

        document.body.classList.add("fade-out");

        setTimeout(() => {
            window.location = url;
        }, 500);
    });
});
</script>
</body>
</html>
